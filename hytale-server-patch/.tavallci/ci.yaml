version: 2

source:
  repository: TavallStudios/HyRhythm
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

artifacts:
  - name: hyrhythm-patched-server
    path: build/distributions/Server-2026.02.19-1a311a592-patched.jar

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - "clean"
      - "check"
      - "assemble"
